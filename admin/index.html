<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="bg-dark border-right" id="sidebar-wrapper">
            <div class="sidebar-heading text-white">Admin Panel</div>
            <div class="list-group list-group-flush">
                <a href="#" class="list-group-item list-group-item-action bg-dark text-white" onclick="showView('dashboard')">Dashboard</a>
                <a href="#" class="list-group-item list-group-item-action bg-dark text-white" onclick="showView('users')">User Management</a>
                <a href="#" class="list-group-item list-group-item-action bg-dark text-white" onclick="showView('loans')">Loan Management</a>
                <a href="#" class="list-group-item list-group-item-action bg-dark text-white" onclick="showView('wallet')">Wallet Management</a>
                <a href="#" class="list-group-item list-group-item-action bg-dark text-white" onclick="showView('savings')">Savings Management</a>
                <a href="#" class="list-group-item list-group-item-action bg-dark text-white" onclick="showView('transactions')">Transactions</a>
                <a href="#" class="list-group-item list-group-item-action bg-dark text-white" onclick="showView('support')">Support Tickets</a>
                <a href="#" class="list-group-item list-group-item-action bg-dark text-white" onclick="showView('settings')">Settings</a>
                <a href="#" class="list-group-item list-group-item-action bg-dark text-white" id="logout-btn">Logout</a>
            </div>
        </div>
        <!-- /#sidebar-wrapper -->

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
                <div class="container-fluid">
                    <h2 id="view-title">Dashboard</h2>
                </div>
            </nav>

            <main class="container-fluid p-4">
                <!-- Dashboard View -->
                <div id="dashboard-view" class="view">
                    <h3>Dashboard Overview</h3>
                    <p>Welcome, <span id="admin-username">Admin</span>!</p>
                    <!-- Stats cards will go here -->
                </div>

                <!-- User Management View -->
                <div id="users-view" class="view" style="display: none;">
                    <h3>User Management</h3>
                    <!-- User table will go here -->
                </div>

                <!-- Other views will follow the same pattern -->

            </main>
        </div>
        <!-- /#page-content-wrapper -->
    </div>
    <!-- /#wrapper -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
